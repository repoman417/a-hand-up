# Render blueprint for A Hand Up.
# Deploy with: render.com blueprint sync.
# Cost: $7/mo Starter web service + 1 GB disk at $0.25/GB/mo
# = ~$7.25/mo. The disk holds the SQLite database.
# Note: Render has no bun runtime, so this runs on Node
# and installs Bun during the build. The app still runs on Bun.
services:
  - type: web
    name: a-hand-up
    env: node
    plan: starter
    buildCommand: curl -fsSL https://bun.sh/install | bash && export BUN_INSTALL="$HOME/.bun" && export PATH="$BUN_INSTALL/bin:$PATH" && bun install && bun run build
    startCommand: export BUN_INSTALL="$HOME/.bun" && export PATH="$BUN_INSTALL/bin:$PATH" && bun run start
    disk:
      name: a-hand-up-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATABASE_PATH
        value: /var/data/app.db
