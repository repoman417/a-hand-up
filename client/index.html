<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A Hand Up — small asks, paid directly</title>
<style>
  :root { --ink:#2d2620; --muted:#7a6f63; --line:#e8ddcd; --accent:#9c6f45; --accent-soft:#f7ead9; --warn:#8a5a1e; --card:#fffdf8; --bg:#faf6ef; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.5; }
  header { background: var(--accent); color: #fff; padding: 18px 16px; }
  header .wrap { max-width: 760px; margin: 0 auto; }
  header h1 { margin:0; font-size: 1.5rem; }
  header p { margin: 4px 0 0; opacity: .9; }
  header p.welcome { margin-top: 10px; font-style: italic; opacity: .95; }
  nav { background: #fff; border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
  nav .wrap { max-width: 760px; margin: 0 auto; display: flex; gap: 4px; padding: 0 8px; flex-wrap: wrap; }
  nav button { background: none; border: none; padding: 12px 12px; font-size: 1rem; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  nav button.right { margin-left: auto; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
  .proof { background: var(--accent-soft); border-color: #e8cfa8; }
  .proof h2 { margin: 0 0 4px; font-size: 1.15rem; }
  .proof ul { margin: 8px 0 0; padding-left: 20px; }
  .proof .zero { color: var(--muted); font-style: italic; }
  .ask-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .ask-head h3 { margin: 0; }
  .amount { font-size: 1.25rem; font-weight: 700; white-space: nowrap; }
  .badge { display: inline-block; background: #fdf0d5; color: var(--warn); border-radius: 999px; padding: 2px 10px; font-size: .85rem; margin-top: 6px; }
  .badge.verified { background: #e6f4ea; color: #1e7e34; margin-left: 6px; }
  .cap-note { margin: 8px 0 0; font-size: .92rem; color: var(--ink); }
  .meta { color: var(--muted); font-size: .92rem; margin: 6px 0; }
  .btn { background: var(--accent); color: #fff; border: none; border-radius: 12px; padding: 10px 16px; font-size: 1rem; cursor: pointer; }
  .btn.secondary { background: #fff; color: var(--accent); border: 1px solid var(--accent); }
  .btn.danger { background: #fff; color: #b91c1c; border: 1px solid #b91c1c; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; }
  input, select { width: 100%; padding: 10px; font-size: 1rem; border: 1px solid #d8cbb6; border-radius: 10px; background: #fff; }
  .hint { color: var(--muted); font-size: .88rem; font-weight: 400; }
  .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
  .notice { background: var(--accent-soft); border: 1px solid #e8cfa8; border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
  .empty { color: var(--muted); text-align: center; padding: 24px 0; }
  .pay-box { background: #fff8e6; border: 1px solid #f0d9a8; border-radius: 12px; padding: 12px; margin-top: 10px; }
  .pay-box code { font-size: 1.1rem; background: #fff; padding: 2px 6px; border-radius: 4px; }
  .status { font-weight: 600; }
  .status.locked { color: var(--warn); }
  .status.met { color: var(--accent); }
  .status.open { color: #2563eb; }
  .status.withdrawn { color: var(--muted); }
  .status.expired { color: var(--muted); }
  footer { max-width: 760px; margin: 0 auto; padding: 8px 16px 32px; color: var(--muted); font-size: .88rem; }
  h2 { font-size: 1.25rem; }
  .how h3 { margin-top: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/app.js"></script>
</body>
</html>
